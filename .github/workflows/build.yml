# Builds the arm64 binary for every push to main and publishes it on the rolling
# `main-latest` release, where deploy/update.sh picks it up. The Pi can't build it itself:
# compiling modernc.org/sqlite needs more RAM than it has.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-main
  cancel-in-progress: false

jobs:
  arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o voice-expenses-linux-arm64 .
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum voice-expenses-linux-arm64 | cut -d' ' -f1 > voice-expenses-linux-arm64.sha256
          echo "$GITHUB_SHA" > commit
          gh release view main-latest >/dev/null 2>&1 ||
            gh release create main-latest --prerelease --title "main (latest build)" --notes "Rolling arm64 build of main."
          # `commit` goes last: update.sh only trusts the binary once it names the commit it wants.
          gh release upload main-latest voice-expenses-linux-arm64 voice-expenses-linux-arm64.sha256 --clobber
          gh release upload main-latest commit --clobber
