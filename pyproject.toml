[project]
name = "voice-expenses"
version = "0.1.0"
description = "Voice expense logging"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "openai>=3.29.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
local-whisper = [
    "faster-whisper>=1.2.1",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9,<10",
]

